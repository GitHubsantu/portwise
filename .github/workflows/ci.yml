name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: dependency install scripts never run in CI (docs/SECURITY.md T9)
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:prod
      - run: npm run package
      - name: Run Extension Development Host integration tests
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:integration
      - name: Run Windows Extension Development Host integration tests
        if: matrix.os == 'windows-latest'
        run: npm run test:integration
      - run: npm audit --audit-level=high --omit=dev
      - name: Record the main CI-built VSIX checksum
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sha256sum portwise-*.vsix >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: portwise-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30
